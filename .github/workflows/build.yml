name: Build Windows Executable

on:
  push:
    tags:
      - 'v*' # Triggers automatically whenever you push a version tag like v1.0.0

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
            python-version: '3.10'
            cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install customtkinter requests python-dotenv certifi urllib3 pyinstaller

      - name: Build with PyInstaller
        run: |
          pyinstaller --noconfirm -- icon.ico --onefile --windowed --collect-all customtkinter app.py

      - name: Create GitHub Release and Upload Binary
        uses: softprops/action-gh-release@v2
        with:
          files: dist/app.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
